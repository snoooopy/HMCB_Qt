; libmcbctrl 连接与设备配置（INITIAL 时由库读取，已接线指向本目录）。
; 本文件解析器不支持行内注释（值会连同注释一起读入），注释必须独立成行。
; 用途 2：增益自动校准完成后 [RANGE0] 节 MCB0DM0..MCB0DMn 档位写回本文件。
[CONNECTION]
; MCB0 的 IP，多板时第 n 板自动偏移 n<<24；端口为库编译期常量不可配
IPADDR=192.111.111.211
; 1=INITIAL 后自动连接设备
AUTOCONNECT=1
[MCB]
; 板数 / 是否启用 HMCB-4 模式 / 自动获取 DM 数 / HMCB4 结尾板号
MCBNUM=1
ENMCBX4=0
AUTODMNUM=0
MCBENDB4=0
; MCB0 的 ADM 模块数（GETDMINFO 返回 nDMNum，数据网格列数/页数由此决定；
; 库默认 8 钳位 1..MAX_MCBADNUM=64，HMCB4 实配 25 → 网格 3 页）
MCB0ADNUM=25
[ADM]
; AD 位数与 APP 显示位宽（APPADBIT 缺省跟随 ADBIT）
ADBIT=20
APPADBIT=20
; 程控增益；0=关闭算法
PGAMP=1.0
ALG=0
; 1=附加 A/D 数据字节；1=测试模式（看内置测试图案）
AADDB=1
TESTMODE=0
; DM 几何：行×列
ROW=32
COLUMN=4
; 1=双阈值模式；1=列合并；1=调整 AinDi
DTM=0
COL_COMBINE=0
ADJ_AINDI=0
; 1=硬件序列号模式；1=CX(HE)模式；1=四档锁定；1=三能量累积
HWSN=1
CXMODE=1
GOUDANG_S4=0
THREEENERGYACC=0
; 0=采集起始不需要 0xA5 数据包；1=调试输出
NEEDA5=0
DEBUG=0
[CHADJ]
; 1=MCB 数据合并；1=零填充
MCBDATAMERGING=0
ZEROPADDING=1
[EXDATA]
; 1=库内保存原始数据
SAVEDATA=0
[LOG]
; 0=关日志；文件默认写本目录 HMCBCtrl.log
LOGLEVEL=0

[MCB]
//HMCB /HMCB/S2-4控制模块数量
MCBNUM = 3
//MCBxADNUM:第x个MCB所带的前端AD模块(探测器模块)的总数量，x从0开始
MCB0ADNUM = 16
//MCBxDByADNUM:第x个MCB的第y个DBline所带的前端AD模块(探测器模块)的数量，x从0开始
MCB0DB0ADNUM = 4
MCB0DB1ADNUM = 4
MCB0DB2ADNUM = 4
MCB0DB3ADNUM = 4

//MCBxADNUM:第x个MCB所带的前端AD模块(探测器模块)的总数量，x从0开始
MCB1ADNUM = 16
//MCBxDByADNUM:第x个MCB的第y个DBline所带的前端AD模块(探测器模块)的数量，x从0开始
MCB1DB0ADNUM = 4
MCB1DB1ADNUM = 4
MCB1DB2ADNUM = 4
MCB1DB3ADNUM = 4

//MCBxADNUM:第x个MCB所带的前端AD模块(探测器模块)的总数量，x从0开始
MCB2ADNUM = 16
//MCBxDByADNUM:第x个MCB的第y个DBline所带的前端AD模块(探测器模块)的数量，x从0开始
MCB2DB0ADNUM = 4

; libmcbctrl 连接与设备配置（INITIAL 时由库读取，已接线指向本目录）。
; 本文件解析器不支持行内注释（值会连同注释一起读入），注释必须独立成行。
; 用途 2：增益自动校准完成后 [RANGE0] 节 MCB0DM0..MCB0DMn 档位写回本文件。
; 当前值对齐实际设备 CX1664DE（参照 Windows 版 HMCBCtrl.dll_V1.4.4 发布包
; 的 MCBCtrl.ini，2026-08-20 该配置在 Windows 上连接 192.111.111.211 成功）。
[CONNECTION]
; MCB0 的 IP，多板时第 n 板自动偏移 n<<24；端口为库编译期常量不可配
IPADDR=192.111.111.211
; 1=INITIAL 后自动连接设备
AUTOCONNECT=1
[MCB]
; 板数 / 是否启用 HMCB-4 模式 / 自动获取 DM 数 / 控制盒使能 4 端口
; ENMCBX4=1 时库走 InitialMCB_HMCB4 路径（Windows 成功日志 "HMCB(4)0-DB0" 即此模式）
MCBNUM=1
ENMCBX4=1
AUTODMNUM=0
MCBENDB4=1
; MCB0 的 ADM 模块数（GETDMINFO 返回 nDMNum，数据网格列数/页数由此决定）
MCB0ADNUM=1
; 各 DB line 所带 ADM 模块数（HMCB4 模式按 DB 分配，DB0 挂 1 个模块）
MCB0DB0ADNUM=1
MCB0DB1ADNUM=0
MCB0DB2ADNUM=0
MCB0DB3ADNUM=0
[ADM]
; AD 位数与 APP 显示位宽（APPADBIT 缺省跟随 ADBIT）
ADBIT=16
APPADBIT=16
; 程控增益；0=关闭算法
PGAMP=1.0
ALG=0
; 1=附加 A/D 数据字节；1=测试模式（看内置测试图案）
AADDB=1
TESTMODE=0
; 探测器 FPGA（DB FPGA）配置 bin 文件名——库在本目录（SETCONFIGFILE 指向的
; config 目录）下查找；缺失时 INITIAL 的 ConfigFpga 失败并断开连接（Linux 库
; 在该失败路径上存在缺陷，会紧跟段错误，务必保证文件存在）
BINFILE=HMCB_CX1664DE_DAC17_HEMode_CK_FT_DS_V1.0.0.bin
; DM 几何：行×列
ROW=64
COLUMN=2
; 1=双阈值模式；1=列合并；1=调整 AinDi
DTM=0
COL_COMBINE=0
ADJ_AINDI=0
; 1=硬件序列号模式；1=CX(HE)模式；1=四档锁定；1=三能量累积
HWSN=1
CXMODE=1
GOUDANG_S4=0
THREEENERGYACC=0
; 1=采集起始需要先收到 0xA5 数据包
NEEDA5=1
DEBUG=0
[CHADJ]
; 1=MCB 数据合并；1=零填充
MCBDATAMERGING=0
ZEROPADDING=1
[MODE0]
; 内触发时序：曝光时间 / 积分时间（us）
POTMT=4000
INTT=2000
[RANGE0]
; 增益档位（增益自动校准写回）
MCB0DM0=0
[EXDATA]
; 1=库内保存原始数据
SAVEDATA=0
[LOG]
; 0=关日志；文件默认写本目录 HMCBCtrl.log
LOGLEVEL=0

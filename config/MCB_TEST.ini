; 测量参数（McbController::startUp 读取，对照 Windows MCB_TEST.ini）。
; 阈值为 0 表示未设=不判定，现场定标后改。
[VZERO]
SAMPLENUM=512      ; Zero 测量帧数(≤1024 参与均值)
MAXVZ=0            ; 上限(mV)
MINVZ=0            ; 下限(mV)
FORMAT=0           ; 0=LSB 1=mV

[VNOISE]
SAMPLENUM=2048     ; Noise 测量帧数(≥200 判定，≤2048 参与统计)
MAXVN=0            ; 上限
MINVN=0            ; 下限
MAXVND=0           ; NoiseD(辉散)上限
MINVND=0           ; NoiseD 下限
FORMAT=0           ; 0=FWHM 1=RMS 2=SNR 3=ERB

[INL]
SAMPLENUM=512      ; 每点帧数(≤20000)
DAMAX=16100        ; 14bit DA 上限(100..16100)
MEASUREPOINT=12    ; 扫描点数(5..40)
MAXINL=33554432    ; INL 限值(千分比×1000, 默认 0x2000000≈不判定)
MAXDIF=33554432    ; DIV 限值(百分比×100, 默认 0x2000000≈不判定)

; ---- 以下两节暂未参与运行（键保留对照 Windows 版） ----
[FILE]
REPORTFORMAT=0     ; 0=csv 1=txt；当前忠实复刻 Windows 行为：csv/txt 总是双写，本键失效
[XRAY]
XDOSERATE=187700   ; 剂量率；Phase 4 XRay 列用，本期只存

; 应用级配置（main.cpp / McbController 读取）
[BACKEND]
; 后端模式：mock=仿真（无需硬件） / real=连接真实设备（libmcbctrl）
Mode=仿真
; 硬件 IP 的实际生效位置在 config/MCBCtrl.ini [CONNECTION] IPADDR。
; 本键为 Phase 4“设置 IP”功能预留，当前未参与连接。
DefaultIP=192.111.111.211

; 探测器几何（仅 mock 后端使用；real 模式下设备就绪后按 getDmInfo 实际值自动调整）
[GEOMETRY]
DMNum=25      ; DM 模块数（仿真）
RowNum=32     ; 每 DM 行数
ColNum=4      ; 每 DM 列数（每模块通道 = RowNum*ColNum = 128）
